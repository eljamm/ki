name: Python tests

on:
  push: { branches: ["dev"] }
  pull_request: { branches: ["dev"] }
  workflow_dispatch:

permissions: {}

jobs:
  build:
    strategy:
      matrix:
        python-version: ["3.13", "3.14", "3.15"]
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    env:
      UV_FROZEN: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update && sudo apt-get install -y tidy

      - name: Configure git
        run: |
          git config --global user.email "ki@example.com"
          git config --global user.name "Ki GithubActions"
          git --version

      - name: Install ki and test dependencies
        run: |
          uv sync --extra dev --frozen

      - name: Test package
        run: |
          uv run pytest -vv tests/test_package.py
          uv run ./tests/test_subdeck.sh

      - name: Unit tests
        run: |
          uv run pytest -vv --timeout=120 tests/test_ki.py tests/test_parser.py

      - name: Integration tests
        run: |
          uv run pytest -vv --timeout=120 tests/test_integration.py
