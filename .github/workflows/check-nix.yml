name: Nix tests

on:
  push: { branches: ["dev"] }
  pull_request: { branches: ["dev"] }
  workflow_dispatch:

permissions: {}

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: eljamm-untrusted
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Check project
        run: |
          nix flake check -L --keep-going
