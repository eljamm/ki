name: Weekly changelog

permissions: {}

on:
  schedule:
    # Each Sunday at 02:00
    # https://crontab.guru/#0_2_*_*_0
    - cron: "0 2 * * 0"

  workflow_dispatch:

jobs:
  create-changelog:
    if: github.repository == 'eljamm/ki'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          ref: "dev"

      - name: Update changelog
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        id: git-cliff
        with:
          version: latest
          config: cliff.toml
          args: --verbose
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: "update_changelog"
          delete-branch: true
          title: "chore: Update CHANGELOG.md"
          commit-message: "chore: Update CHANGELOG.md"
          committer: GitHub <noreply@github.com>
          author: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>
          labels: automated
          body: |
            Update changelog.

            *PR auto-generated by the [weekly changelog workflow](../actions/workflows/changelog.yml).*
