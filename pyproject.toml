[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "ki"
version = "0.0.18a"
description = "version control for Anki collections"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.13"
dependencies = [
  "lark==1.3.1",
  "anki==26.9.3",
  "tqdm==4.70.1",
  "click==8.5.0",
  "colorama==0.4.6",
  "beartype==0.23.1",
  "gitpython==3.2.1",
  "whatthepatch==1.0.7",
  "git-filter-repo==2.47.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-mock",
  "pytest-timeout",
  "checksumdir==1.3.0",
  "bitstring==4.3.1",
  "loguru",
  "coverage",
]

[project.urls]
Homepage = "https://langfield.github.io/ki"

[project.scripts]
ki = "ki:ki"

[tool.setuptools]
packages = ["ki"]
# NOTE: using this field is discouraged [1^], but `subdeck` is a bash script
# which we need to copy, so we can't have it in `project.scripts`.
#
# [1^]: https://setuptools.pypa.io/en/latest/userguide/pyproject_config.html
script-files = ["subdeck"]

[tool.setuptools.package-data]
ki = ["grammar.lark", "jekyll-gh-pages.yml"]
